name: Publish production branch for Hoster.kz Plesk

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Automatic content synchronization"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: hoster-production
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:data
      - run: npm run build
      - name: Publish verified dist to production branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C dist init
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist checkout -B production
          git -C dist add --all
          git -C dist commit -m "deploy: ${GITHUB_SHA}"
          git -C dist remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C dist push --force origin production
